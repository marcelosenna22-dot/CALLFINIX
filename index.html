<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CallFinix Áudio e Vídeo</title>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #d1d7db;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* TELA DE LOGIN */
        #login-screen {
            background: white;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            text-align: center;
            width: 90%;
            max-width: 380px;
        }

        #login-screen h2 { 
            margin-bottom: 20px; 
            color: #008069; 
            font-size: 24px;
        }

        #login-screen input, #login-screen button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        #login-screen button {
            background-color: #00a884;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        #login-screen button:active {
            background-color: #008069;
        }

        /* CONTAINER DO APP */
        #app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            background-color: #fff;
            position: relative;
            overflow: hidden;
        }

        /* BARRA LATERAL / GAVETA DE CONTATOS */
        .sidebar {
            width: 350px;
            background-color: #ffffff;
            border-right: 1px solid #e9edef;
            display: flex;
            flex-direction: column;
            z-index: 10;
            transition: transform 0.3s ease-in-out;
        }

        .header {
            background-color: #f0f2f5;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #d1d7db;
            font-weight: bold;
            color: #111b21;
            height: 60px;
            min-height: 60px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .action-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:active {
            background-color: #e0e0e0;
        }

        .add-contact-box {
            padding: 10px;
            background: #f6f6f6;
            display: flex;
            gap: 5px;
            border-bottom: 1px solid #e9edef;
        }

        .add-contact-box input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 15px;
        }

        .add-contact-box button {
            background: #00a884;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
        }

        .contact-list { 
            flex: 1; 
            overflow-y: auto; 
        }

        .contact-item {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f2f5;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .contact-item:active, .contact-item.active { background-color: #f0f2f5; }

        .avatar {
            width: 42px;
            height: 42px;
            background-color: #00a884;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            text-transform: uppercase;
        }

        /* ÁREA DE CHAT */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #efeae2;
            position: relative;
            height: 100%;
        }

        .messages-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            -webkit-overflow-scrolling: touch;
        }

        /* BALÕES DE MENSAGEM */
        .message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 15px;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }

        .message.sent { background-color: #d9fdd3; align-self: flex-end; }
        .message.received { background-color: #ffffff; align-self: flex-start; }

        .message .time {
            font-size: 10px;
            color: #667781;
            text-align: right;
            margin-top: 4px;
        }

        audio {
            width: 100%;
            max-width: 230px;
            height: 40px;
            margin-top: 5px;
        }

        /* BARRA DE ENVIO */
        .chat-input-area {
            background-color: #f0f2f5;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #d1d7db;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 15px;
            background: white;
        }

        .btn-icon {
            background: #00a884;
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-icon:active { background-color: #008069; }

        .btn-mic.recording {
            background-color: #e53935;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* BTN DE EXPANDIR CONTATOS (MOBILE) */
        .toggle-contacts-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #00a884;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        /* OVERLAY DA GAVETA MOBILE */
        #drawer-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 9;
        }

        /* TELA DE CHAMADA DE VÍDEO */
        #video-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .video-grid {
            position: relative;
            width: 100%;
            height: 80%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #remote-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #111;
        }

        #local-video {
            width: 100px;
            height: 140px;
            object-fit: cover;
            position: absolute;
            bottom: 15px;
            right: 15px;
            border-radius: 10px;
            border: 2px solid white;
            background: #222;
        }

        .call-controls {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }

        .btn-end-call {
            background: #e53935;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        .no-chat-selected {
            display: flex; 
            flex: 1; 
            align-items: center;
            justify-content: center; 
            color: #667781;
            text-align: center;
            padding: 20px;
        }

        /* MEDIA QUERIES (ADAPTAÇÃO CELULAR) */
        @media (max-width: 768px) {
            #app-container { height: 100vh; border-radius: 0; }

            .sidebar {
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                width: 82%;
                max-width: 320px;
                transform: translateX(-100%);
                box-shadow: 2px 0 10px rgba(0,0,0,0.2);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            #drawer-overlay.open {
                display: block;
            }

            .message { max-width: 90%; }
        }
    </style>
</head>
<body>

    <!-- 1. TELA DE LOGIN -->
    <div id="login-screen">
        <h2>CallFinix</h2>
        <input type="text" id="meu-usuario" placeholder="Digite seu usuário (ex: marcelo)">
        <button onclick="entrar()">Entrar</button>
    </div>

    <!-- 2. APP CONTAINER -->
    <div id="app-container" style="display: none;">
        
        <!-- MASCARA DE FUNDO DA GAVETA (MOBILE) -->
        <div id="drawer-overlay" onclick="fecharGaveta()"></div>

        <!-- BARRA LATERAL (CONTATOS) -->
        <div class="sidebar" id="sidebar">
            <div class="header">
                <span>👤 <span id="usuario-logado"></span></span>
                <button class="action-btn" onclick="fecharGaveta()" title="Fechar Menu">✕</button>
            </div>

            <div class="add-contact-box">
                <input type="text" id="novo-contato" placeholder="Adicionar contato...">
                <button onclick="adicionarContato()">+</button>
            </div>

            <div class="contact-list" id="lista-contatos"></div>
        </div>

        <!-- ÁREA DO CHAT -->
        <div class="chat-area">
            <div class="header" id="chat-header">
                <!-- BOTÃO + PARA EXPANDIR CONTATOS -->
                <button class="toggle-contacts-btn" onclick="abrirGaveta()">
                    ➕ Contatos
                </button>

                <span id="nome-contato-ativo" style="flex:1; margin-left: 10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                    Selecione um contato
                </span>

                <div class="header-actions" id="call-actions" style="display: none;">
                    <button class="action-btn" onclick="iniciarChamadaVideo()" title="Chamada de Vídeo">📹</button>
                </div>
            </div>

            <div class="messages-container" id="container-mensagens">
                <div class="no-chat-selected" id="mensagem-vazia">
                    Clique no botão "➕ Contatos" para ver seus contatos e conversar
                </div>
            </div>

            <!-- BARRA DE ENVIO DE MENSAGENS -->
            <div class="chat-input-area" id="area-envio" style="display: none;">
                <input type="text" id="input-mensagem" placeholder="Digite uma mensagem..." onkeypress="verificarTeclaEnter(event)">
                <button class="btn-icon btn-mic" id="btn-mic" onclick="alternarGravacao()" title="Gravar Áudio">🎙️</button>
                <button class="btn-icon" onclick="enviarMensagem()" title="Enviar">➤</button>
            </div>

            <!-- MODAL DE CHAMADA DE VÍDEO -->
            <div id="video-modal">
                <div class="video-grid">
                    <video id="remote-video" autoplay playsinline></video>
                    <video id="local-video" autoplay playsinline muted></video>
                </div>
                <div class="call-controls">
                    <button class="btn-end-call" onclick="encerrarChamada()">Desconectar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SDKs do Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB5sq4ndamrQkuGYvwcppumfoIXOI13l_4",
            authDomain: "callfinix.firebaseapp.com",
            databaseURL: "https://callfinix-default-rtdb.firebaseio.com",
            projectId: "callfinix",
            storageBucket: "callfinix.firebasestorage.app",
            messagingSenderId: "689768509927",
            appId: "1:689768509927:web:42463967decbacee324d42",
            measurementId: "G-FPFGLQTEMS"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let usuarioAtual = "";
        let contatoAtivo = "";
        let escutaMensagens = null;

        // Áudio
        let mediaRecorder = null;
        let audioChunks = [];
        let gravando = false;

        // Vídeo
        let peer = null;
        let chamadaAtual = null;
        let localStream = null;

        // CONTROLE DA GAVETA DE CONTATOS (MOBILE)
        function abrirGaveta() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('drawer-overlay').classList.add('open');
        }

        function fecharGaveta() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('drawer-overlay').classList.remove('open');
        }

        function entrar() {
            const input = document.getElementById('meu-usuario').value.trim().toLowerCase();
            if (!input) return alert("Digite um nome válido!");

            usuarioAtual = input;
            document.getElementById('usuario-logado').innerText = usuarioAtual;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';

            carregarContatos();
            inicializarPeer();
            escutarChamadasRecebidas();
        }

        function adicionarContato() {
            const novoContato = document.getElementById('novo-contato').value.trim().toLowerCase();
            if (!novoContato || novoContato === usuarioAtual) return;

            database.ref('usuarios/' + usuarioAtual + '/contatos/' + novoContato).set(true)
                .then(() => document.getElementById('novo-contato').value = '');
        }

        function carregarContatos() {
            database.ref('usuarios/' + usuarioAtual + '/contatos').on('value', (snapshot) => {
                const lista = document.getElementById('lista-contatos');
                lista.innerHTML = '';
                const contatos = snapshot.val();

                if (contatos) {
                    Object.keys(contatos).forEach((contato) => {
                        const div = document.createElement('div');
                        div.className = `contact-item ${contato === contatoAtivo ? 'active' : ''}`;
                        div.onclick = () => {
                            abrirChat(contato);
                            fecharGaveta(); // Fecha a gaveta após selecionar no mobile
                        };
                        div.innerHTML = `
                            <div class="avatar">${contato.charAt(0)}</div>
                            <div><strong>${contato}</strong></div>
                        `;
                        lista.appendChild(div);
                    });
                }
            });
        }

        function obterChatId(u1, u2) {
            return [u1, u2].sort().join('_');
        }

        function abrirChat(contato) {
            contatoAtivo = contato;
            document.getElementById('nome-contato-ativo').innerText = contato;
            document.getElementById('area-envio').style.display = 'flex';
            document.getElementById('call-actions').style.display = 'flex';
            
            const msgVazia = document.getElementById('mensagem-vazia');
            if (msgVazia) msgVazia.style.display = 'none';

            carregarContatos();

            if (escutaMensagens) database.ref('chats/' + escutaMensagens).off();

            const chatId = obterChatId(usuarioAtual, contatoAtivo);
            escutaMensagens = chatId;

            database.ref('chats/' + chatId).on('value', (snapshot) => {
                const container = document.getElementById('container-mensagens');
                container.innerHTML = '';
                const mensagens = snapshot.val();

                if (mensagens) {
                    Object.values(mensagens).forEach((msg) => {
                        const divMsg = document.createElement('div');
                        const ehMinha = msg.remetente === usuarioAtual;
                        divMsg.className = `message ${ehMinha ? 'sent' : 'received'}`;
                        
                        const hora = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                        if (msg.tipo === 'audio') {
                            divMsg.innerHTML = `
                                <audio controls src="${msg.texto}"></audio>
                                <div class="time">${hora}</div>
                            `;
                        } else {
                            divMsg.innerHTML = `
                                <div>${msg.texto}</div>
                                <div class="time">${hora}</div>
                            `;
                        }
                        container.appendChild(divMsg);
                    });
                    container.scrollTop = container.scrollHeight;
                }
            });
        }

        function enviarMensagem(conteudo = null, tipo = 'texto') {
            const input = document.getElementById('input-mensagem');
            const texto = conteudo || input.value.trim();

            if (!texto || !contatoAtivo) return;

            const chatId = obterChatId(usuarioAtual, contatoAtivo);

            database.ref('chats/' + chatId).push({
                remetente: usuarioAtual,
                texto: texto,
                tipo: tipo,
                timestamp: Date.now()
            }).then(() => {
                if (tipo === 'texto') input.value = '';
            });
        }

        function verificarTeclaEnter(e) {
            if (e.key === 'Enter') enviarMensagem();
        }

        // =============================================================
        // GRAVAÇÃO DE VOZ MELHORADA PARA CELULARES
        // =============================================================
        async function alternarGravacao() {
            const btnMic = document.getElementById('btn-mic');

            if (!gravando) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    
                    // Suporte a diferentes formatos de áudio para dispositivos Android/iOS
                    let options = {};
                    if (MediaRecorder.isTypeSupported('audio/webm')) {
                        options = { mimeType: 'audio/webm' };
                    } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
                        options = { mimeType: 'audio/mp4' };
                    }

                    mediaRecorder = new MediaRecorder(stream, options);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunks.push(e.data);
                    };
                    
                    mediaRecorder.onstop = () => {
                        const mimeType = mediaRecorder.mimeType || 'audio/webm';
                        const audioBlob = new Blob(audioChunks, { type: mimeType });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            const base64Audio = reader.result;
                            enviarMensagem(base64Audio, 'audio');
                        };
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    gravando = true;
                    btnMic.classList.add('recording');
                } catch (err) {
                    alert("Erro ao acessar microfone no aparelho: " + err.message);
                }
            } else {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
                gravando = false;
                btnMic.classList.remove('recording');
            }
        }

        // =============================================================
        // WEBRTC / PEERJS
        // =============================================================
        function inicializarPeer() {
            peer = new Peer(usuarioAtual);
        }

        async function iniciarChamadaVideo() {
            if (!contatoAtivo) return;

            document.getElementById('video-modal').style.display = 'flex';

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;

                chamadaAtual = peer.call(contatoAtivo, localStream);

                chamadaAtual.on('stream', (remoteStream) => {
                    document.getElementById('remote-video').srcObject = remoteStream;
                });

            } catch (err) {
                alert("Não foi possível acessar a câmera/microfone.");
                encerrarChamada();
            }
        }

        function escutarChamadasRecebidas() {
            peer.on('call', async (call) => {
                const aceitar = confirm(`Chamada de vídeo de ${call.peer}. Aceitar?`);
                if (aceitar) {
                    document.getElementById('video-modal').style.display = 'flex';
                    chamadaAtual = call;

                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    document.getElementById('local-video').srcObject = localStream;

                    call.answer(localStream);

                    call.on('stream', (remoteStream) => {
                        document.getElementById('remote-video').srcObject = remoteStream;
                    });
                } else {
                    call.close();
                }
            });
        }

        function encerrarChamada() {
            if (chamadaAtual) chamadaAtual.close();
            if (localStream) localStream.getTracks().forEach(track => track.stop());

            document.getElementById('video-modal').style.display = 'none';
            document.getElementById('local-video').srcObject = null;
            document.getElementById('remote-video').srcObject = null;
        }
    </script>
</body>
</html>
