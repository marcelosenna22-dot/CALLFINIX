<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat / Lista de Contatos em Tempo Real</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 20px auto;
            padding: 15px;
            background-color: #f4f4f9;
        }
        .card {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        input, button {
            padding: 10px;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: #e9ecef;
            margin: 5px 0;
            padding: 8px 12px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="card" id="login-section">
        <h2>1. Identifique-se</h2>
        <input type="text" id="meu-usuario" placeholder="Digite seu nome (ex: marcelo)">
        <button onclick="entrar()">Entrar</button>
    </div>

    <div class="card" id="app-section" style="display: none;">
        <h2>Bem-vindo, <span id="usuario-logado"></span>!</h2>
        
        <h3>Adicionar Contato</h3>
        <input type="text" id="novo-contato" placeholder="Nome do contato (ex: marcelo1)">
        <button onclick="adicionarContato()">Adicionar Contato</button>

        <h3>Meus Contatos</h3>
        <ul id="lista-contatos"></ul>
    </div>

    <!-- SDKs do Firebase (Versão Compatível por CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // -------------------------------------------------------------
        // CONFIGURAÇÃO DO FIREBASE (Substitua pelos seus dados do console do Firebase)
        // -------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyB5sq4ndamrQkuGYvwcppumfoIXOI13l_4",
  authDomain: "callfinix.firebaseapp.com",
  databaseURL: "https://callfinix-default-rtdb.firebaseio.com",
  projectId: "callfinix",
  storageBucket: "callfinix.firebasestorage.app",
  messagingSenderId: "689768509927",
  appId: "1:689768509927:web:42463967decbacee324d42",
  measurementId: "G-FPFGLQTEMS"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let usuarioAtual = "";

        // Entrar com o usuário
        function entrar() {
            const input = document.getElementById('meu-usuario').value.trim();
            if (!input) return alert("Digite um nome válido!");

            usuarioAtual = input;
            document.getElementById('usuario-logado').innerText = usuarioAtual;
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('app-section').style.display = 'block';

            // Escutar atualizações da lista de contatos em TEMPO REAL
            ouvirContatos();
        }

        // Adicionar contato no banco de dados central
        function adicionarContato() {
            const novoContato = document.getElementById('novo-contato').value.trim();
            if (!novoContato) return alert("Digite o nome do contato!");

            // Salva na chave: /usuarios/{meu_nome}/contatos/{nome_do_contato}
            database.ref('usuarios/' + usuarioAtual + '/contatos/' + novoContato).set(true)
                .then(() => {
                    document.getElementById('novo-contato').value = '';
                    alert("Contato adicionado com sucesso!");
                })
                .catch((error) => console.error("Erro ao salvar:", error));
        }

        // Escutar alterações do banco e atualizar a tela automaticamente
        function ouvirContatos() {
            const contatosRef = database.ref('usuarios/' + usuarioAtual + '/contatos');
            
            contatosRef.on('value', (snapshot) => {
                const lista = document.getElementById('lista-contatos');
                lista.innerHTML = '';

                const contatos = snapshot.val();
                if (contatos) {
                    Object.keys(contatos).forEach((contato) => {
                        const li = document.createElement('li');
                        li.innerText = contato;
                        lista.appendChild(li);
                    });
                } else {
                    lista.innerHTML = '<li>Nenhum contato adicionado ainda.</li>';
                }
            });
        }
    </script>
</body>
</html>
